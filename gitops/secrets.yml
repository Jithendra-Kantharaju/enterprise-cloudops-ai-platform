apiVersion: v1
kind: Secret
metadata:
  name: boutique-secrets
  namespace: boutique
type: Opaque
stringData:
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123
  AUTH_DB_URL: postgresql://postgres:postgres123@boutique-postgres:5432/auth_db
  PRODUCTS_DB_URL: postgresql://postgres:postgres123@boutique-postgres:5432/products_db
  ORDERS_DB_URL: postgresql://postgres:postgres123@boutique-postgres:5432/orders_db
  USERS_DB_URL: postgresql://postgres:postgres123@boutique-postgres:5432/users_db
  # ---- FDE AI assistant ----
  # PLACEHOLDER ONLY. Replace at deploy time and do NOT commit the real key.
  # Prefer creating this out-of-band:
  #   kubectl -n boutique create secret generic boutique-secrets --from-literal=OPENAI_API_KEY=sk-... (merge)
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_OPENAI_KEY"
